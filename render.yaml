services:
  # ── Single service: Express serves API + Flutter web ──────────────────────
  - type: web
    name: hotel-iq
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --prefix src/backend
    startCommand: node src/backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://hoteliq.us
      - key: MONGODB_URI
        sync: false
