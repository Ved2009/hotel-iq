services:
  # ── Express backend (API) ──────────────────────────────────────────────────
  - type: web
    name: hotel-iq-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install --prefix src/backend
    startCommand: node src/backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://hotel-iq-app.onrender.com
      - key: MONGODB_URI
        sync: false

  # ── Flutter web frontend (static site) ────────────────────────────────────
  - type: web
    name: hotel-iq-app
    env: static
    buildCommand: echo "Pre-built Flutter web — no build step needed"
    staticPublishPath: flutter_app/build/web
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
